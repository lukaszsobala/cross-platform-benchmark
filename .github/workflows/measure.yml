# Measure a machine and upload a result nobody can fake.
#
# `build.binary_sha256` says which binary a result claims to come from, but it
# sits inside a document the submitter wrote, so it is a claim. This workflow is
# how a result gets a signature instead:
#
#   1. it downloads a published cpcpub binary and checks it against the
#      SHA256SUMS of the same release, so what runs is not the caller's choice;
#   2. it runs it with fixed arguments;
#   3. it asks GitHub for an OIDC token whose *audience* is the SHA-256 of the
#      result document it just produced;
#   4. it posts the result with that token alongside.
#
# Step 3 is the whole thing. GitHub signs a statement binding those exact bytes
# to this workflow, and the hub checks that signature before it will mark the
# run. Edit one digit of the numbers and the token no longer matches them. Mint
# a token for different bytes and you need GitHub's private key.
#
# Two tiers come out of this, and they are not the same claim:
#
#   github-hosted runner  Nothing in the chain belongs to the submitter -- our
#                         workflow, GitHub's machine, GitHub's signature. This
#                         is the tier that is actually binding, and it can only
#                         ever measure GitHub's own hardware.
#
#   self-hosted runner    Same workflow, same signatures, but the machine is the
#                         submitter's. It rules out editing a JSON file. It does
#                         not rule out an operator who tampers with the runner,
#                         and no protocol run on someone's own hardware can.
#
# Call it from your own repository to measure your own machine:
#
#   jobs:
#     measure:
#       uses: lukaszsobala/cross-platform-benchmark/.github/workflows/measure.yml@v0.1.0
#       permissions:
#         id-token: write        # required: this is what mints the token
#         contents: read
#       with:
#         hub: https://hub.example
#         label: "my workstation"
#       secrets:
#         hub_token: ${{ secrets.CPCPUB_TOKEN }}    # optional
#
# Note what is deliberately *not* an input: which repository the binary comes
# from, and the benchmark's arguments. Both are fixed below. A caller who could
# choose either could produce whatever numbers they liked and still collect a
# github-hosted attestation, which would make the strong tier worthless.
#
# Secrets: `hub_token` is the caller's own upload token, passed to curl through
# the environment and never printed. The OIDC request token
# (ACTIONS_ID_TOKEN_REQUEST_TOKEN) is ambient and short-lived; the step that
# uses it does not run under `set -x`. The attestation itself is not a secret --
# it authorises nothing and is bound to one document.

name: measure

on:
  workflow_call:
    inputs:
      hub:
        description: "base URL of the results hub"
        required: true
        type: string
      release:
        description: "release tag to take the binary from, or 'latest'"
        required: false
        default: latest
        type: string
      label:
        description: "short label for the run"
        required: false
        default: ""
        type: string
      notes:
        description: "longer notes: cooling, governor, anything explaining it"
        required: false
        default: ""
        type: string
      runner:
        description: >-
          runs-on label for the machine to measure: a self-hosted label for
          your own hardware, or a GitHub-hosted image. This chooses the
          machine, not the trust tier -- that comes from GitHub's own
          runner_environment claim, which the caller cannot set.
        required: false
        default: ubuntu-24.04
        type: string
    secrets:
      hub_token:
        description: "upload token, to put the run on your hub account"
        required: false
  workflow_dispatch:
    inputs:
      hub:
        description: "base URL of the results hub"
        required: true
        type: string
      release:
        description: "release tag to take the binary from, or 'latest'"
        required: false
        default: latest
        type: string
      label:
        required: false
        default: ""
        type: string
      notes:
        required: false
        default: ""
        type: string
      runner:
        description: "runs-on label for the machine to measure"
        required: false
        default: ubuntu-24.04
        type: string

permissions: {}

jobs:
  measure:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    permissions:
      id-token: write        # mint the OIDC token; nothing else is needed
      contents: read
    steps:
      # Fixed here, not taken from an input: the binary must come from the
      # upstream releases or the strong tier means nothing.
      - name: Fetch a published binary
        env:
          SOURCE_REPO: lukaszsobala/cross-platform-benchmark
          RELEASE: ${{ inputs.release || 'latest' }}
        run: |
          set -eu
          case "$RELEASE" in
            latest) base="https://github.com/$SOURCE_REPO/releases/latest/download" ;;
            *)      base="https://github.com/$SOURCE_REPO/releases/download/$RELEASE" ;;
          esac

          arch=$(uname -m)
          case "$arch" in
            x86_64)  assets="cpcpub-linux-x86_64" ;;
            aarch64) assets="cpcpub-linux-aarch64" ;;
            riscv64) assets="cpcpub-linux-riscv64-rva23 cpcpub-linux-riscv64" ;;
            *) echo "no published binary for $arch" >&2; exit 1 ;;
          esac

          curl -fsSL -o SHA256SUMS "$base/SHA256SUMS"
          # On RISC-V, prefer the RVA23 build and fall back to the portable one
          # when this CPU cannot run it. Every candidate is checked against the
          # release's own checksum file before it is executed.
          for name in $assets; do
            curl -fsSL -o cpcpub "$base/$name" || continue
            want=$(awk -v n="$name" '$2 == n || $2 == "*" n { print $1 }' SHA256SUMS)
            got=$(sha256sum cpcpub | cut -d' ' -f1)
            [ -n "$want" ] && [ "$want" = "$got" ] || {
              echo "checksum mismatch for $name" >&2; exit 1; }
            chmod +x cpcpub
            if ./cpcpub --list-variants >/dev/null 2>&1; then
              echo "using $name ($got)"
              echo "ASSET=$name" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "$name does not run on this CPU, trying the next" >&2
          done
          echo "no published binary runs here" >&2
          exit 1

      # Fixed arguments, for the same reason the source is fixed. Everything
      # about the configuration is recorded in the document anyway, so a reader
      # can see what was run -- but on a github-hosted runner nobody should be
      # able to choose it.
      - name: Measure
        run: |
          set -eu
          ./cpcpub --full --json > run.json
          python3 -c 'import json;d=json.load(open("run.json"));print(d["build"]["flags"])'

      # The binding step. The audience is the digest of the file, so GitHub
      # signs a statement about these bytes and no others. No `set -x` here:
      # the request token is a credential, even if a short-lived one.
      - name: Ask GitHub to sign the result
        run: |
          set -eu
          digest=$(sha256sum run.json | cut -d' ' -f1)
          echo "result digest: $digest"
          python3 - "$digest" <<'PY'
          import json, os, sys, urllib.parse, urllib.request

          audience = "cpu-bench-result:sha256:" + sys.argv[1]
          url = (os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
                 + "&audience=" + urllib.parse.quote(audience))
          req = urllib.request.Request(url, headers={
              "Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
              "Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=30) as resp:
              token = json.load(resp)["value"]
          # Written to a file, not to the log and not to an output: it is bound
          # to one document, but there is no reason to print it.
          with open("attestation.jwt", "w") as f:
              f.write(token)
          print("attestation issued for", audience)
          PY

      - name: Upload it
        env:
          HUB: ${{ inputs.hub }}
          LABEL: ${{ inputs.label }}
          NOTES: ${{ inputs.notes }}
          HUB_TOKEN: ${{ secrets.hub_token }}
        run: |
          set -eu
          # Inputs reach curl through the environment and python's quoting, so
          # a label containing shell metacharacters is a label, not a command.
          query=$(python3 -c '
          import os, urllib.parse
          q = {k: v for k, v in (("label", os.environ["LABEL"]),
                                 ("notes", os.environ["NOTES"])) if v}
          print("?" + urllib.parse.urlencode(q) if q else "")')

          set -- -fsS -X POST "${HUB%/}/api/runs$query" \
              -H "Content-Type: application/json" \
              -H "X-CPU-Bench-Attestation: $(cat attestation.jwt)" \
              --data-binary @run.json
          if [ -n "${HUB_TOKEN:-}" ]; then
            set -- "$@" -H "Authorization: Bearer $HUB_TOKEN"
          fi
          curl "$@" | tee upload.json
          echo

      - name: Summarise
        if: always()
        run: |
          {
            echo "## cpcpub measurement"
            echo
            echo "- binary: \`${ASSET:-unknown}\`"
            echo "- runner: \`$RUNNER_ENVIRONMENT\` on \`$(uname -m)\`"
            if [ -f upload.json ]; then
              echo "- hub reply: \`$(cat upload.json)\`"
            fi
            echo
            if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
              echo "Nothing in this chain belongs to the submitter, so the hub"
              echo "can mark it as measured by CI."
            else
              echo "This ran on a self-hosted runner: the signatures hold, but"
              echo "the machine belongs to whoever registered the runner, so the"
              echo "hub marks it *attested* rather than *CI-measured*."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurement-${{ github.run_id }}
          path: |
            run.json
            attestation.jwt
          if-no-files-found: warn
          retention-days: 14
